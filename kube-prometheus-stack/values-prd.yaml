app-secrets:
  external:
    remotePrefix: /k8s/prd-0e9c

alerts:
  platformSlackChannel: 'alerts-platform-prd'
  blockchainSlackChannel: 'alerts-blockchain-prd'
  appsSlackChannel: 'alerts-apps-prd'

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      retention: 90d
      retentionSize: 40GiB
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 50Gi
      additionalScrapeConfigs:
        - job_name: sd_node_exporter
          ec2_sd_configs:
            - region: eu-north-1
              port: 9100
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: eu-central-1
              port: 9100
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: us-west-2
              port: 9100
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: us-east-2
              port: 9100
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: ap-southeast-1
              port: 9100
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
          relabel_configs:
            - source_labels: [namespace]
              target_label: namespace
              replacement: 'aenodes'
            - source_labels: [__meta_ec2_public_ip]
              replacement: '${1}:9100'
              target_label: __address__
            - source_labels: [__meta_ec2_instance_id]
              target_label: instance
            - source_labels: [__meta_ec2_public_ip]
              target_label: public_ip
            - source_labels: [__meta_ec2_instance_type]
              target_label: instance_type
            - source_labels: [__meta_ec2_instance_lifecycle]
              target_label: lifecycle
            - source_labels: [__meta_ec2_ami]
              target_label: ami
            - source_labels: [__meta_ec2_region]
              target_label: region
            - source_labels: [__meta_ec2_tag_role]
              target_label: role
            - source_labels: [__meta_ec2_tag_env]
              target_label: env
            - source_labels: [__meta_ec2_tag_kind]
              target_label: kind
            - source_labels: [__meta_ec2_tag_Name]
              target_label: name
        - job_name: sd_statsd_exporter
          ec2_sd_configs:
            - region: eu-north-1
              port: 9102
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: eu-central-1
              port: 9102
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: us-west-2
              port: 9102
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: us-east-2
              port: 9102
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
            - region: ap-southeast-1
              port: 9102
              filters:
                - name: instance-state-name
                  values: [running]
                - name: tag:role
                  values: [aenode]
          relabel_configs:
            - source_labels: [namespace]
              target_label: namespace
              replacement: 'aenodes'
            - source_labels: [__meta_ec2_public_ip]
              replacement: '${1}:9102'
              target_label: __address__
            - source_labels: [__meta_ec2_instance_id]
              target_label: instance
            - source_labels: [__meta_ec2_public_ip]
              target_label: public_ip
            - source_labels: [__meta_ec2_instance_type]
              target_label: instance_type
            - source_labels: [__meta_ec2_instance_lifecycle]
              target_label: lifecycle
            - source_labels: [__meta_ec2_ami]
              target_label: ami
            - source_labels: [__meta_ec2_region]
              target_label: region
            - source_labels: [__meta_ec2_tag_role]
              target_label: role
            - source_labels: [__meta_ec2_tag_env]
              target_label: env
            - source_labels: [__meta_ec2_tag_kind]
              target_label: kind
            - source_labels: [__meta_ec2_tag_Name]
              target_label: name

    ingress:
      hosts:
        - "prometheus.prd.aeternity.io"

  grafana:
    grafana.ini:
      server:
        domain: grafana.prd.aeternity.io
        root_url: https://grafana.prd.aeternity.io
    ingress:
      hosts:
        - "grafana.prd.aeternity.io"

  alertmanager:
    alertmanagerSpec:
      externalUrl: "https://alertmanager.prd.aeternity.io"
    ingress:
      hosts:
        - "alertmanager.prd.aeternity.io"
